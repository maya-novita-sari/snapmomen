<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Login Snapmomen</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
<style>
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{background:#fff;padding:40px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,0.1);max-width:400px;width:100%}
.auth-card h1{text-align:center;margin-bottom:10px}
.auth-card p{text-align:center;color:#777;margin-bottom:30px}
.field{margin-bottom:16px}
.field label{display:block;font-weight:700;font-size:0.85rem;margin-bottom:6px}
.field input{width:100%;padding:12px 14px;border-radius:12px;border:2px solid #ddd;font-size:1rem}
.field input:focus{outline:none;border-color:#4FC3F7}
.error-text{color:#C24040;font-size:0.85rem;min-height:18px;text-align:center;margin-bottom:10px}
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <h1>Snapmomen</h1>
    <p>Login untuk mulai foto</p>
    <div class="field">
      <label>Username</label>
      <input type="text" id="username" placeholder="Masukkan username">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="Masukkan password">
    </div>
    <div class="error-text" id="errText"></div>
    <button class="btn btn-start" onclick="doLogin()" style="width:100%">Login</button>
    <p style="margin-top:20px;font-size:0.9rem;text-align:center">
      Belum punya akun? <a href="register.html">Daftar di sini</a>
    </p>
  </div>
</div>
<script src="js/api.js"></script>
<script>
async function doLogin() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const err      = document.getElementById('errText');
  if (!username || !password) { err.textContent = 'Isi semua field'; return; }
  try {
    const data = await apiFetch('/api/auth/login', {
      method: 'POST',
      body: JSON.stringify({ username, password })
    });
    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));
    location.href = data.user.role === 'admin' ? 'dashboard-admin.html' : 'studio.html';
  } catch (e) { err.textContent = e.message; }
}
document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
