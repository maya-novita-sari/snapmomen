<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Premium Snapmomen</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
<style>
.premium-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#FDF6E3}
.premium-card{background:#fff;padding:40px;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,0.1);max-width:480px;width:100%;text-align:center}
.countdown{display:flex;justify-content:center;gap:20px;margin:20px 0}
.countdown-num{font-size:3rem;font-weight:900;color:#5FD3C4;line-height:1}
.countdown-label{font-size:0.85rem;color:#666}
.input-group{display:flex;gap:10px;margin-top:12px}
.input-group input{flex:1;padding:12px 16px;border-radius:12px;border:2px solid #ddd;font-size:1rem;text-transform:uppercase}
.input-group input:focus{outline:none;border-color:#5FD3C4}
.error-text{color:#C24040;font-size:0.85rem;min-height:18px;margin-top:8px}
</style>
</head>
<body>
<div class="premium-wrap">
  <div class="premium-card">
    <h1>Premium</h1>
    <div id="statusBox">Loading...</div>
  </div>
</div>
<script>window.ADMIN_WA = '628123456789';</script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/premium.js"></script>
</body>
</html>
