<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium — Snapmomen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/premium.css">
</head>
<body>
<div class="doodles"></div>
<header class="topbar">
  <div class="brand">📸 Snap<span>momen</span></div>
  <div class="nav-actions" id="navActions"></div>
</header>

<div class="premium-wrap">
  <div class="premium-card">
    <div class="premium-crown"></div>
    <h2 style="margin:6px 0">Snapmomen Premium</h2>

    <div id="notPremiumBox">
      <p style="opacity:.75">Buka semua bingkai eksklusif dengan kode premium dari admin.</p>
      <a href="#" id="waBtn" target="_blank" class="btn btn-primary" style="width:100%;margin-bottom:16px">💬 Chat Admin di WhatsApp</a>

      <div class="redeem-box">
        <label>Sudah punya kode? Masukkan kode premium</label>
        <input type="text" id="codeInput" placeholder="SNAP-XXXXXX" style="text-transform:uppercase">
        <div class="error-text" id="redeemError"></div>
        <button class="btn btn-pink" style="width:100%" id="redeemBtn">Redeem</button>
      </div>
    </div>

    <div id="premiumBox" style="display:none">
      <span class="status-pill active">Premium Aktif</span>
      <div class="premium-countdown" id="premiumCountdown">-</div>
      <div class="premium-expiry">Berlaku sampai <span id="premiumExpiry">-</span></div>
      <a href="studio.html" class="btn btn-primary" style="width:100%;margin-top:20px">Kembali ke Studio</a>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script src="js/premium.js"></script>
</body>
</html>
