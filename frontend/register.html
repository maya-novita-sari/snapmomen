<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar — Snapmomen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="doodles"></div>
<div class="auth-wrap">
  <div class="auth-card">
    <h2>✨ Buat Akun</h2>
    <div class="field">
      <label>Username</label>
      <input type="text" id="username" placeholder="Minimal 3 karakter">
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="nama@email.com">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="Minimal 4 karakter">
    </div>
    <div class="field">
      <label>Konfirmasi Password</label>
      <input type="password" id="password2" placeholder="Ulangi password">
    </div>
    <div class="error-text" id="errText"></div>
    <button class="btn btn-primary" style="width:100%" id="regBtn">Daftar</button>
    <p class="auth-foot">Sudah punya akun? <a href="login.html">Masuk di sini</a></p>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script>
  document.getElementById('regBtn').addEventListener('click', async () => {
    const username = document.getElementById('username').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const password2 = document.getElementById('password2').value;
    const errText = document.getElementById('errText');
    errText.textContent = '';

    if (password !== password2) { errText.textContent = 'Konfirmasi password tidak sama.'; return; }

    try {
      await registerUser(username, email, password);
      showToast('Akun berhasil dibuat!');
      setTimeout(() => location.href = 'studio.html', 600);
    } catch (err) {
      errText.textContent = err.message || 'Registrasi gagal.';
    }
  });
</script>
</body>
</html>
