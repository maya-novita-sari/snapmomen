<!DOCTYPE html>
<html>
<head><title>Hasil Foto</title></head>
<body>
    <h1>Hasil Foto</h1>
    <div id="preview"></div>
    <script>
        const data = JSON.parse(localStorage.getItem('photobooth-result') || '[]');
        const preview = document.getElementById('preview');
        data.forEach(src => {
            const img = document.createElement('img');
            img.src = src;
            img.style.width = '150px';
            preview.appendChild(img);
        });
    </script>
</body>
</html>
